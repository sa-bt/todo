# =======================================================
#  کانفیگ nginx برای API لاراول — استقرار عادی روی سرور (بدون داکر)
#  لاراول با php-fpm سرو می‌شود، نه با proxy_pass به یک پورت.
#
#  مسیر نصب: /etc/nginx/sites-available/todo-api.conf
#  فعال‌سازی: ln -s /etc/nginx/sites-available/todo-api.conf /etc/nginx/sites-enabled/
#  بررسی و بارگذاری: nginx -t && systemctl reload nginx
#
#  این فایل برای حالت «API روی زیردامنه‌ی جدا» است که با تنظیم فعلی اپ سمت کاربر
#  هم‌خوان است (VITE_API_URL یک آدرس مطلق است، یعنی اپ از ابتدا برای API روی
#  دامنه‌ی دیگر نوشته شده). اگر API را روی همان دامنه‌ی اپ می‌خواهی، به بلوک
#  کامنت‌شده‌ی انتهای todo-front.conf نگاه کن.
# =======================================================

server {
    listen 80;
    listen [::]:80;

    # 👇 زیردامنه‌ی خودت را بگذار
    server_name api.example.com;

    # 👇 پوشه‌ی public پروژه‌ی لاراول (نه ریشه‌ی پروژه)
    root /var/www/todo-backend/public;

    index index.php;
    charset utf-8;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 👇 سوکت php-fpm. نسخه باید ۸.۲ یا بالاتر باشد (composer.json: php ^8.2).
        #    Debian/Ubuntu:  /run/php/php8.2-fpm.sock
        #    RHEL/AlmaLinux: /run/php-fpm/www.sock
        #    برای اطمینان:  ls /run/php/
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # جلوگیری از اجرای PHP در پوشه‌های آپلود
    location ~ ^/(storage|uploads)/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/todo-api.error.log;
    access_log /var/log/nginx/todo-api.access.log;

    # =======================================================
    #  HTTPS: certbot --nginx -d api.example.com
    #  دسترسی به Web Push و سرویس‌ورکر بدون HTTPS ممکن نیست.
    # =======================================================
}
