# Dedicated frontend entry for the admin subdomain.
# Keep `root` aligned with the directory that receives the Vite `dist/` files.
server {
    listen 80;
    listen [::]:80;

    server_name admin.sa-bt.ir;
    root /var/www/todo-front;
    charset utf-8;

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location ~* \.webmanifest$ {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/admin-pwa-.*\.png$ {
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        try_files $uri =404;
    }

    # `/` must never resolve through `index index.html`; that document carries
    # the user manifest and would install the wrong application identity.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /admin.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri /admin.html;
    }

    client_max_body_size 50M;

    error_log  /var/log/nginx/todo-admin.error.log;
    access_log /var/log/nginx/todo-admin.access.log;
}
