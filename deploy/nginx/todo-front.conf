# =======================================================
#  کانفیگ nginx برای سرو کردن خروجی dist اپ Do IT
#  مسیر نصب: /etc/nginx/sites-available/todo-front.conf
#  فعال‌سازی: ln -s /etc/nginx/sites-available/todo-front.conf /etc/nginx/sites-enabled/
#  بررسی و بارگذاری: nginx -t && systemctl reload nginx
#
#  ⚠️ نکته‌ی کلیدی: هدرهای کش این فایل بخش جدانشدنی چرخه‌ی به‌روزرسانی PWA هستند.
#     اگر sw.js و فایل‌های HTML با no-store سرو نشوند، مرورگر تا ۲۴ ساعت نسخه‌ی
#     قدیمی سرویس‌ورکر را از HTTP cache می‌خواند و آپدیت دیده نمی‌شود.
# =======================================================

server {
    listen 80;
    listen [::]:80;

    # 👇 دامنه‌ی خودت را بگذار
    server_name example.com www.example.com;

    # 👇 مسیری که محتوای پوشه‌ی dist در آن قرار می‌گیرد
    root /var/www/todo-front;

    index index.html;
    charset utf-8;

    # --- فشرده‌سازی ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json application/wasm
        image/svg+xml font/woff font/woff2;

    # ==================================================
    #  فایل‌هایی که هرگز نباید کش شوند
    # ==================================================

    # سرویس‌ورکر: مهم‌ترین قاعده‌ی این فایل
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    # اسناد ورودی هر دو اپ
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /en.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # manifest ها؛ باید تازه باشند تا نام و آیکون اپ نصب‌شده به‌روز شود
    location ~* \.webmanifest$ {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # ==================================================
    #  فایل‌هایی که با هش نام‌گذاری شده‌اند و برای همیشه کش می‌شوند
    # ==================================================
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # آیکون‌های PWA: کش کوتاه تا تغییر آیکون اپ نصب‌شده سریع دیده شود
    location ~* ^/(admin-)?pwa-.*\.png$ {
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        try_files $uri =404;
    }

    # بقیه‌ی فایل‌های استاتیک بدون هش
    location ~* \.(?:png|jpe?g|gif|ico|svg|wav|mp3|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ==================================================
    #  مسیریابی SPA: هر اپ به سند ورودی خودش برمی‌گردد
    # ==================================================

    # پنل مدیریت → admin.html (تا manifest پنل، نه manifest اپ کاربر، سرو شود)
    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /admin.html =404;
    }

    location ^~ /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri /admin.html;
    }

    # اپ کاربر → index.html
    location = /fa {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

    location = /en {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /en.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 50M;

    error_log  /var/log/nginx/todo-front.error.log;
    access_log /var/log/nginx/todo-front.access.log;

    # ==================================================
    #  API — دو حالت ممکن است؛ فقط یکی را انتخاب کن
    #
    #  حالت ۱ (پیش‌فرض و توصیه‌شده): API روی زیردامنه‌ی جدا.
    #     چیزی در همین فایل لازم نیست؛ از `todo-api.conf` استفاده کن.
    #     با تنظیم فعلی اپ هم‌خوان است، چون VITE_API_URL یک آدرس مطلق است.
    #
    #  حالت ۲: API روی همین دامنه در مسیر /api/.
    #     بلوک زیر را از کامنت دربیاور و VITE_API_URL را به /api تغییر بده و
    #     دوباره بیلد بگیر. لاراول با php-fpm سرو می‌شود، پس ریشه‌ی این دو بلوک
    #     پوشه‌ی public پروژه‌ی بک‌اند است، نه ریشه‌ی اپ سمت کاربر.
    #     (سرویس‌ورکر درخواست‌های شامل /api/ را عبور می‌دهد و کش نمی‌کند.)
    # ==================================================
    # location ^~ /api/ {
    #     root /var/www/todo-backend/public;
    #     try_files $uri /index.php$is_args$args;
    # }
    #
    # location ~ \.php$ {
    #     root /var/www/todo-backend/public;
    #     try_files $uri =404;
    #     fastcgi_split_path_info ^(.+\.php)(/.+)$;
    #     # سوکت php-fpm نسخه ۸.۲ یا بالاتر (composer.json: php ^8.2)
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    #     fastcgi_param DOCUMENT_ROOT $realpath_root;
    #     fastcgi_read_timeout 120s;
    #     fastcgi_hide_header X-Powered-By;
    # }

    # =======================================================
    #  HTTPS: با certbot اجرا کن تا بلوک ۴۴۳ به‌صورت خودکار اضافه شود
    #    apt install certbot python3-certbot-nginx
    #    certbot --nginx -d example.com -d www.example.com
    #  یادآوری: سرویس‌ورکر و Web Push فقط روی HTTPS کار می‌کنند
    #  (به‌جز localhost).
    # =======================================================
}
